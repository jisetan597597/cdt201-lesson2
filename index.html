<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- h1 是主标题标签，全页通常只有一个，表示最重要的标题 -->
<h1>欢迎来到谈佩琦的第一个GitHub网页</h1>

<!-- h2 是副标题标签，用于划分页面中的主要板块/章节 -->
<h2>关于我</h2>

<!-- p 是段落标签（Paragraph），用于存放页面上的文本段落 -->
<p>大家好，我是谈佩琦，现在是旅游娱乐管理专业的准大二学生，很高兴能在这里与大家见面！同时我也是一位创意手工爱好者，喜欢挖掘一些新事物。</p>

<!-- h2 同样是副标题标签，用于开启另一个新的主题板块 -->
<h2>本学期的3个目标与期望</h2>

<!-- ul 是无序列表标签（Unordered List），包裹整个列表；其中的 li 是列表项目标签（List Item），代表具体每一项内容 -->
<ul>
  <li>1.掌握网页设计核心基础内容</li>
  <li>2.能够独立完成网页设计制作</li>
  <li>3.做出好看的网页</li>
</ul>
    <!-- 副標題 (h2)：私房景點/美食區塊 -->
    <h2>我的私房景點/美食</h2>

    <!-- 段落 (p) 與 超連結 (a)：包含指向 Google Map 的超連結 -->
    <p>
        我最推薦的地方：<strong>日月潭</strong> 
        (<a href="https://maps
.google.com" target="_blank"＞點我看地圖＜/a>)
    </p >
</body>
</html>
